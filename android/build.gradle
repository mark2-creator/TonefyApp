// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

ext {
  // react-native-iap's own default (7.0.0, see node_modules/react-native-iap/
  // android/gradle.properties) is below Google Play's new minimum of 8.0.0,
  // required from 31 Aug 2026 or app updates get rejected. The library reads
  // rootProject.ext.playBillingSdkVersion first if present (see its own
  // build.gradle's getExtOrDefault), so this overrides it without needing an
  // upstream release.
  playBillingSdkVersion = "8.0.0"
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
